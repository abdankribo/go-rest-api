<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Forge</title><style>:root{--a:#06b6d4}*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f7f8fb;font:15px Inter,system-ui,sans-serif}header{position:sticky;top:0;background:#08090dee;backdrop-filter:blur(12px);border-bottom:1px solid #282e38;padding:16px 5vw;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{color:white;text-decoration:none;font-weight:900}.brand small{display:block;color:#7f8999;font-size:10px}nav{display:flex;gap:6px;flex-wrap:wrap}nav a{color:#98a2b2;text-decoration:none;padding:9px 12px;border-radius:9px}nav a:hover{background:var(--a);color:#fff}main{max-width:1180px;margin:auto;padding:60px 5vw}h1{font-size:clamp(44px,7vw,82px);line-height:.95;letter-spacing:-.06em;margin:0 0 15px}p{color:#9ca5b4;line-height:1.7}.heroimg{height:190px;border-radius:18px;background:linear-gradient(135deg,var(--a),#151922);display:grid;place-items:center;font-size:70px;margin:25px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.grid>div,.card,.balance{background:#0f1218;border:1px solid #29303a;border-radius:16px;padding:20px}.grid b,.balance b{display:block;font-size:30px;margin-top:9px}.list{border:1px solid #29303a;border-radius:16px;overflow:hidden;margin-top:18px}.list>div{padding:15px 18px;border-bottom:1px solid #252b34;display:flex;justify-content:space-between;gap:12px}.chart{height:270px;display:flex;align-items:end;gap:7px;margin:25px 0}.chart i{flex:1;background:var(--a);border-radius:5px 5px 0 0}button{border:0;background:var(--a);color:#fff;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer;margin:5px 4px 5px 0}input,select,textarea{display:block;width:100%;background:#0a0d12;border:1px solid #303744;color:#fff;border-radius:9px;padding:11px;margin:7px 0 14px}pre{color:#bfc8d5;white-space:pre-wrap}@media(max-width:760px){header{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}main{padding:40px 5vw}}</style></head><body><header><a class="brand" href="?view=0">◉ API Forge<small>LOCAL DEMO · NO DATABASE</small></a><nav><a href="?view=0">Console</a><a href="?view=1">Endpoints</a><a href="?view=2">Request</a><a href="?view=3">Docs</a></nav></header><main id="app"></main><script>let items=JSON.parse(localStorage.apiItems||'[{"id":1,"name":"Notebook"},{"id":2,"name":"Keyboard"}]');function save(){localStorage.apiItems=JSON.stringify(items)}function render(){let v=+(new URLSearchParams(location.search).get('view')||0);app.innerHTML=v===0?'<h1>REST API console.</h1><p>Simulasi endpoint Go tanpa server eksternal.</p><div class="card"><code>GET /api/items</code><pre>'+JSON.stringify(items,null,2)+'</pre></div><button onclick="toast()">Send request</button>':v===1?'<h1>Endpoints</h1><div class="grid"><div><b>GET</b><p>/api/items</p></div><div><b>POST</b><p>/api/items</p></div><div><b>DELETE</b><p>/api/items/:id</p></div></div>':v===2?'<h1>Request Builder</h1><form onsubmit="return req(event)"><select id="method"><option>POST</option><option>DELETE</option></select><input id="name" placeholder="Item name"><input id="id" type="number" placeholder="ID for DELETE"><button>Send</button></form><pre id="out"></pre>':'<h1>API Docs</h1><div class="card"><pre>GET    /api/items\nPOST   /api/items {name}\nDELETE /api/items/:id</pre></div>'}function req(e){e.preventDefault();if(method.value==='POST'){items.push({id:Date.now(),name:name.value});out.textContent=JSON.stringify(items.at(-1),null,2)}else{items=items.filter(x=>x.id!==+id.value);out.textContent='204 No Content'}save();return false}function toast(){alert('200 OK · '+items.length+' items returned')}render();</script></body></html>
