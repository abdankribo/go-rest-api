<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Forge</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f7f7f9;--a:#06b6d4;font:15px Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}header{height:74px;border-bottom:1px solid #262a31;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;background:#08090de8;backdrop-filter:blur(12px);z-index:5}.brand{font-weight:900}.brand small{display:block;color:#8e96a5;font-size:10px;margin-top:4px}nav{display:flex;gap:7px;flex-wrap:wrap}nav a{padding:9px 11px;border-radius:9px;color:#9da5b3}nav a:hover,nav a.active{background:var(--a);color:white}main{max-width:1180px;margin:auto;padding:65px 5vw}h1{font-size:clamp(45px,7vw,82px);line-height:.93;letter-spacing:-.065em;margin:10px 0 15px}h2{letter-spacing:-.03em}p{color:#9ba3b2;line-height:1.7}small{display:block;color:#8e96a5;font-size:11px;letter-spacing:.06em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:30px 0}.grid.four{grid-template-columns:repeat(4,1fr)}.grid article,.panel,.list,.balance{border:1px solid #282d36;border-radius:17px;background:#0e1015;padding:22px}.grid strong{font-size:32px;display:block;margin:10px 0}button{border:0;background:var(--a);color:#fff;padding:11px 15px;border-radius:9px;font-weight:800;cursor:pointer;margin:6px 5px 6px 0}input,select,textarea{background:#101217;border:1px solid #2b3039;color:#fff;padding:12px;border-radius:9px;width:100%;margin:7px 0 15px}.list{padding:0;overflow:hidden;margin-top:25px}.list>div{padding:17px 20px;border-bottom:1px solid #242831;display:flex;justify-content:space-between;gap:20px}.list span{color:#8993a4}.chart{height:210px;display:flex;align-items:end;gap:8px;margin:25px 0}.chart i{flex:1;background:var(--a);border-radius:5px 5px 0 0}.chart.tall{height:350px}.balance{max-width:620px;background:linear-gradient(135deg,#10213a,#0e1015)}.balance strong{display:block;font-size:45px;margin:12px 0}.request{display:flex;gap:10px;align-items:center;border:1px solid #28434a;padding:12px;border-radius:12px;margin:30px 0}.request code{flex:1}.request b{color:#4ade80}.terminal{background:#050705;padding:25px;border-radius:14px;font-family:monospace}pre{white-space:pre-wrap;color:#bfc7d5}@media(max-width:800px){header{height:auto;min-height:74px;padding:15px 5vw;align-items:flex-start;gap:12px;flex-direction:column}.grid,.grid.four{grid-template-columns:1fr}main{padding:40px 5vw}h1{font-size:52px}}</style></head><body><header><a class="brand" href="index.html">◉ API Forge<small>GO • REST API</small></a><nav><a class="active" href="index.html">Dashboard</a><a class="" href="endpoints.html">endpoints</a><a class="" href="request.html">request</a><a class="" href="docs.html">docs</a></nav></header><main><h1>REST API console.</h1><p>Inspect the in-memory Go API from a browser workspace.</p><section class="request"><code><b>GET</b> /api/items</code><button onclick="run()">Send ↗</button></section><pre>{ "items": [{ "id": 1, "name": "Notebook" }, { "id": 2, "name": "Keyboard" }] }</pre><p id="status">200 OK · ready</p><script>function run(){status.textContent='200 OK · '+(8+Math.floor(Math.random()*10))+'ms'}</script></main></body></html>
